services:
  dhl-car-park-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dhl-car-park-app:latest
    container_name: dhl-car-park-app
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
