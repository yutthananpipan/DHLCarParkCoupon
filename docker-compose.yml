services:
  # Backend Service (Express API)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: dhl-car-park-backend:latest
    container_name: dhl-car-park-backend
    ports:
      - "3001:3001"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - dhl-network

  # Frontend Service (Nginx + React)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: dhl-car-park-frontend:latest
    container_name: dhl-car-park-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - dhl-network

networks:
  dhl-network:
    driver: bridge
